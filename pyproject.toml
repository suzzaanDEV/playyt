[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playyt"
version = "0.1.0"
description = "A minimal, colorful, robust YouTube music player for the terminal."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "PlayYT" }]
license = { text = "MIT" }

dependencies = [
    "textual>=0.86.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "yt-dlp>=2023.11.16",
    "google-auth-oauthlib>=1.0.0",
    "google-auth>=2.0.0",
    "google-api-python-client>=2.0.0",
    "toml>=0.10.0",
]

[project.scripts]
playyt = "playyt.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "C4", "TRY", "RUF", "PL"]
ignore = ["B008", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
